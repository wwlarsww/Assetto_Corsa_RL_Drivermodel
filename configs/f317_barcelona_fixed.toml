[experiment]
seed = 769913
max_episode_steps = 4000
output_directory = "runs"

[environment]
control_frequency_hz = 25.0
track_length_m = 4591.88720703125
track_half_width_m = 6.0
initial_speed_mps = 20.0
minimum_speed_mps = 2.0
minimum_speed_grace_steps = 250
critical_slip_ratio = 0.35

[actions]
pedal_delta_limit = 0.10
steering_delta_limit = 0.05

[rewards]
progress_scale = 1.0
termination_penalty = -100.0
prediction_progress_scale = 0.05
# Inactive compatibility values for the later contextual/ProMP variant.
# fixed_reference_no_promp_v1 never computes an imitation/style reward.
style_initial_coefficient = 1.0
style_target_cost = 0.25
style_lagrange_learning_rate = 0.01
prediction_decay = 0.15

[model]
feature_hidden_sizes = [512, 512]
policy_hidden_sizes = [128, 128]
value_hidden_sizes = [512, 512]
predictor_hidden_sizes = [128, 128]
trajectory_output_size = 10
trajectory_codec = "bezier-5x2"
initial_log_std = -0.5

[dataset]
track_id = "ks_barcelona-layout_gp"
car_id = "dallara_f317"
root_directory = "data/external/assetto_corsa_gym"
racing_line_relative_path = "source/AssettoCorsaConfigs/tracks/ks_barcelona-layout_gp-racing_line_fixed.csv"
track_geometry_relative_path = "source/AssettoCorsaConfigs/tracks/ks_barcelona-layout_gp.csv"
steering_lock_degrees = 240.0
steering_lock_normalized = 0.5341796875

[behavioral_cloning]
method_variant = "fixed_reference_no_promp_v1"
dataset_artifact_path = "data/processed/f317_barcelona/bc_dataset.npz"
epochs = 35
batch_size = 512
learning_rate = 0.0003
weight_decay = 0.00001
predictor_loss_weight = 0.01
validation_fraction = 0.15
test_fraction = 0.15
minimum_speed_mps = 5.0

[ppo]
method_variant = "fixed_reference_no_promp_v1"
total_environment_steps = 1000000
rollout_steps = 2048
update_epochs = 10
minibatch_size = 256
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
value_loss_coefficient = 0.5
entropy_coefficient = 0.0
predictor_loss_coefficient = 0.01
max_gradient_norm = 0.5
use_predicted_progress_reward = true
initial_checkpoint_path = "data/processed/f317_barcelona/bc_checkpoint.pt"
initial_checkpoint_metrics_path = "data/processed/f317_barcelona/bc_summary.json"
maximum_initial_predictor_ade_m = 15.0
maximum_initial_predictor_fde_m = 40.0

[assetto_corsa]
installation_directory = 'C:\Program Files (x86)\Steam\steamapps\common\assettocorsa'
controls_configuration_path = ""
control_backend = "vgamepad"

[reference]
mode = "fixed"
artifact_path = "data/processed/f317_barcelona/fixed_reference.npz"
