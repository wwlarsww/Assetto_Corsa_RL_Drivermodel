[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetto-corsa-ai"
version = "0.1.0"
description = "Reinforcement learning project for autonomous driving in Assetto Corsa"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "gymnasium",
    "stable-baselines3",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.30,<2",
    "mkdocs-gen-files>=0.5,<1",
    "mkdocs-literate-nav>=0.6,<1",
    "pylint>=4.1,<5",
]

diagnostics = [
    "PySide6",
    "pyqtgraph",
]
dev = [
    "pytest",
]

