[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assetto-corsa-ai"
version = "0.1.0"
description = "Reinforcement learning project for autonomous driving in Assetto Corsa"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "gymnasium",
    "stable-baselines3",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest",
]

