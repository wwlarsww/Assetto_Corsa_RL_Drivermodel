site_name: Assetto Corsa RL
site_description: Project guide and Python API reference for the autonomous driving platform
site_url: https://wwlarsww.github.io/Assetto_Corsa_RL_Drivermodel/
repo_url: https://github.com/wwlarsww/Assetto_Corsa_RL_Drivermodel
repo_name: wwlarsww/Assetto_Corsa_RL_Drivermodel
edit_uri: ''
use_directory_urls: false
strict: true

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Project overview:
      - Introduction: index.md
      - Architecture: architecture.md
      - A training step: training_step.md
  - User guide:
      - Getting started: getting_started.md
      - Configuration: configuration.md
      - Training and evaluation: agent_training.md
      - Diagnostics and replay: diagnostics.md
  - Concepts:
      - Telemetry and track data: input.md
      - Controls and actions: control.md
      - Sessions: session_manager.md
      - Environment and resets: racing_environment.md
      - Observations: observation.md
      - Reward: reward.md
      - Episode termination: termination.md
      - Predictor: predictor.md
  - API reference: reference/
  - Contributing:
      - Documentation and publishing: documentation.md

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src, .]
          options:
            allow_inspection: false
            docstring_style: null
            heading_level: 2
            members_order: source
            inherited_members: false
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_source: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: info
  links:
    not_found: warn
    anchors: warn
