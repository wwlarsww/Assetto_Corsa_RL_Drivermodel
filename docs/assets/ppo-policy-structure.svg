<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="556" viewBox="0 0 1180 556" role="img" aria-labelledby="title description">
  <title id="title">PPO policy structure</title>
  <desc id="description">Current controls, vehicle state, road boundaries and reference waypoints form the observation. A shared feature extractor feeds policy, value and predictor heads. The policy predicts a delta mean, which is added to current controls before sampling and action limits. The other heads estimate the value and ten future two-dimensional positions. Dimensions describe the current training template.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243247; text-anchor: middle; }
      .title { font-size: 25px; font-weight: 700; text-anchor: start; }
      .subtitle { font-size: 15px; fill: #526277; text-anchor: start; }
      .heading { font-size: 18px; font-weight: 600; }
      .detail { font-size: 15px; }
      .small { font-size: 14px; fill: #526277; }
      .input { fill: #f3f5f8; stroke: #94a3b8; }
      .features { fill: #ede5f5; stroke: #a78abf; }
      .head { fill: #e8f3df; stroke: #8aaa69; }
      .output { fill: #fce4e5; stroke: #cc9197; }
      .operation { fill: #fff; stroke: #94a3b8; }
      rect { stroke-width: 1.8; }
      .wire { fill: none; stroke: #475569; stroke-width: 2.2; stroke-linejoin: round; }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1180" height="556" fill="white"/>
  <text class="title" x="24" y="34">PPO policy structure</text>
  <text class="subtitle" x="24" y="61">One shared representation, three complementary outputs.</text>

  <!-- Observation inputs and the current-control bypass. -->
  <path class="wire" d="M238 140 H270 M238 236 H270 M238 332 H270 M238 428 H270 M270 140 V428"/>
  <path class="wire arrow" d="M270 318 H310"/>
  <path class="wire arrow" d="M252 140 V94 H946 V190"/>
  <text class="small" x="592" y="86">Current controls</text>

  <rect class="input" x="24" y="104" width="214" height="72" rx="12"/>
  <text x="131" y="134">
    <tspan class="heading" x="131">Current controls</tspan>
    <tspan class="detail" x="131" dy="23">steering, throttle / brake</tspan>
  </text>
  <rect class="input" x="24" y="200" width="214" height="72" rx="12"/>
  <text x="131" y="230">
    <tspan class="heading" x="131">Vehicle state</tspan>
    <tspan class="detail" x="131" dy="23">motion and tyre dynamics</tspan>
  </text>
  <rect class="input" x="24" y="296" width="214" height="72" rx="12"/>
  <text x="131" y="326">
    <tspan class="heading" x="131">Track perception</tspan>
    <tspan class="detail" x="131" dy="23">upcoming road boundaries</tspan>
  </text>
  <rect class="input" x="24" y="392" width="214" height="72" rx="12"/>
  <text x="131" y="422">
    <tspan class="heading" x="131">Reference waypoints</tspan>
    <tspan class="detail" x="131" dy="23">local reference-line points</tspan>
  </text>

  <!-- Shared features and actor / critic / auxiliary heads. -->
  <rect class="features" x="310" y="232" width="200" height="172" rx="16"/>
  <text x="410" y="278">
    <tspan class="heading" x="410">Shared feature</tspan>
    <tspan class="heading" x="410" dy="24">extractor</tspan>
    <tspan class="detail" x="410" dy="32">512 → 512 → 512</tspan>
    <tspan class="small" x="410" dy="25">512 shared features</tspan>
  </text>
  <path class="wire" d="M510 318 H542 M542 206 V430"/>
  <path class="wire arrow" d="M542 206 H574"/>
  <path class="wire arrow" d="M542 318 H574"/>
  <path class="wire arrow" d="M542 430 H574"/>

  <rect class="head" x="574" y="170" width="190" height="72" rx="12"/>
  <text x="669" y="200">
    <tspan class="heading" x="669">Policy head</tspan>
    <tspan class="detail" x="669" dy="23">128 → 128 → 2</tspan>
  </text>
  <rect class="head" x="574" y="282" width="190" height="72" rx="12"/>
  <text x="669" y="312">
    <tspan class="heading" x="669">Value head</tspan>
    <tspan class="detail" x="669" dy="23">128 → 128 → 1</tspan>
  </text>
  <rect class="head" x="574" y="394" width="190" height="72" rx="12"/>
  <text x="669" y="424">
    <tspan class="heading" x="669">Predictor head</tspan>
    <tspan class="detail" x="669" dy="23">128 → 128 → 20</tspan>
  </text>

  <!-- Residual action mean; sampling and constraints follow the addition. -->
  <path class="wire arrow" d="M764 206 H794"/>
  <rect class="operation" x="798" y="170" width="116" height="72" rx="12"/>
  <text x="856" y="201">
    <tspan class="heading" x="856">Delta mean</tspan>
    <tspan class="detail" x="856" dy="23">2 controls</tspan>
  </text>
  <path class="wire arrow" d="M914 206 H929"/>
  <circle cx="946" cy="206" r="16" fill="white" stroke="#475569" stroke-width="2.2"/>
  <path class="wire" d="M938 206 H954 M946 198 V214"/>
  <path class="wire arrow" d="M964 206 H996"/>
  <rect class="output" x="1000" y="170" width="156" height="72" rx="12"/>
  <text x="1078" y="199">
    <tspan class="heading" x="1078">Applied controls</tspan>
    <tspan class="detail" x="1078" dy="23">steering, gas / brake</tspan>
  </text>
  <text class="small" x="1078" y="264">sampling + action limits</text>

  <path class="wire arrow" d="M764 318 H996"/>
  <rect class="output" x="1000" y="282" width="156" height="72" rx="12"/>
  <text x="1078" y="312">
    <tspan class="heading" x="1078">Value estimate</tspan>
    <tspan class="detail" x="1078" dy="23">expected return</tspan>
  </text>

  <path class="wire arrow" d="M764 430 H996"/>
  <rect class="output" x="1000" y="394" width="156" height="72" rx="12"/>
  <text x="1078" y="414">
    <tspan class="heading" x="1078">Predicted</tspan>
    <tspan class="heading" x="1078" dy="21">trajectory</tspan>
    <tspan class="detail" x="1078" dy="21">10 × 2 positions</tspan>
  </text>

  <line x1="24" y1="492" x2="1156" y2="492" stroke="#dbe1e8"/>
  <text class="small" x="590" y="517">Current controls + delta mean → action distribution → sampling and limits → applied controls.</text>
  <text class="small" x="590" y="540">Layer widths and prediction dimensions shown for the current training template.</text>
</svg>
